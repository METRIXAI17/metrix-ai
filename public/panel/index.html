<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Control Panel · Global Ru Workers</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/workers.css" />
  </head>
  <body class="grw">
    <nav class="nav">
      <div class="nav-inner">
        <a href="../index.html" class="logo">
          <span class="logo-text">Control Panel <span>Metrix</span></span>
        </a>
        <div class="nav-links">
          <a href="../index.html">← Global Ru Workers</a>
        </div>
      </div>
    </nav>
    <main class="wrap" style="padding: 2rem 0 4rem">
      <div class="section-head">
        <div>
          <div class="eyebrow">Internal</div>
          <h2>Панель управления бизнесом</h2>
          <p class="how-lead">
            Чистый UX: Sense · Decide · Act. Без нагромождения. Данные — из последнего generate
            (localStorage) или live API.
          </p>
        </div>
      </div>
      <div class="panel-clean" id="panel-root">
        <div class="panel-col">
          <div class="eyebrow">Sense</div>
          <div id="col-sense" class="mini-panel"></div>
        </div>
        <div class="panel-col">
          <div class="eyebrow">Decide</div>
          <div id="col-decide" class="mini-panel"></div>
        </div>
        <div class="panel-col">
          <div class="eyebrow">Act</div>
          <div id="col-act" class="mini-panel"></div>
        </div>
      </div>
      <p class="muted-sm" style="margin-top: 1.5rem" id="panel-empty">
        Нет сохранённого прогона — откройте «Сгенерировать 🔥» на главной.
      </p>
    </main>
    <script>
      (function () {
        function esc(s) {
          return String(s || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");
        }
        function card(k, v) {
          var text = typeof v === "object" ? JSON.stringify(v, null, 0).slice(0, 220) : String(v);
          return '<div class="mp-card"><strong>' + esc(k) + "</strong><div>" + esc(text) + "</div></div>";
        }
        try {
          var raw = localStorage.getItem("metrix_last_generate");
          if (!raw) return;
          var data = JSON.parse(raw);
          var out = data.output || data;
          var panel = out.control_panel || {};
          var cols = panel.columns || [];
          document.getElementById("panel-empty").hidden = true;
          cols.forEach(function (col) {
            var el = document.getElementById("col-" + col.id);
            if (!el) return;
            el.innerHTML = (col.cards || [])
              .map(function (c) {
                return card(c.k, c.v);
              })
              .join("");
          });
        } catch (e) {
          console.warn(e);
        }
      })();
    </script>
  </body>
</html>
