<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0f" />
  <title>Karim Metrix</title>
  <link rel="icon" href="/tg/assets/avatar.jpg" type="image/jpeg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/tg/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="nav">
      <a class="logo" href="#home" data-go="home">
        <span class="logo-mark">
          <img src="/tg/assets/mark.jpg" alt="Metrix AI" width="40" height="40" />
        </span>
        <span>
          <span class="logo-text">Karim <span>Metrix</span></span>
          <span class="logo-sub">билдер</span>
        </span>
      </a>
      <a class="nav-x" href="https://x.com/karimmetrix" target="_blank" rel="noopener">@karimmetrix</a>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-go="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        Главная
      </button>
      <button type="button" data-go="demo">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h10M5 18h7"/><circle cx="18" cy="18" r="3"/></svg>
        Демо
      </button>
      <button type="button" data-go="strategies">
        <svg viewBox="0 0 24 24"><path d="M4 19h16M7 15l3-8 3 5 2-3 4 6"/></svg>
        Стратегии
      </button>
      <button type="button" data-go="agents">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        Агенты
      </button>
    </nav>
  </div>
  <script src="/tg/js/app.js"></script>
</body>
</html>
