<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0f" />
  <title>Metrix AI</title>
  <link rel="icon" href="/tg/assets/avatar.jpg" type="image/jpeg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/tg/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="nav">
      <a class="logo" href="#home" data-go="home">
        <span class="logo-mark">
          <img src="/tg/assets/mark.jpg" alt="Metrix AI" width="40" height="40" />
        </span>
        <span>
          <span class="logo-text">Metrix <span>AI</span></span>
          <span class="logo-sub">Marketplace</span>
        </span>
      </a>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-go="home" class="active">
        <svg viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/></svg>
        Главная
      </button>
      <button type="button" data-go="request">
        <svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h10M5 18h7"/><circle cx="18" cy="18" r="3"/></svg>
        Запрос
      </button>
      <button type="button" data-go="flagships">
        <svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        Карточки
      </button>
      <button type="button" data-go="promo">
        <svg viewBox="0 0 24 24"><path d="M5 19V8l7-4 7 4v11"/><path d="M9 19v-6h6v6"/></svg>
        Промо
      </button>
      <button type="button" data-go="terminal">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 15 3-3-3-3M12 16h5"/></svg>
        Терминал
      </button>
    </nav>
  </div>
  <script src="/tg/js/app.js"></script>
</body>
</html>
