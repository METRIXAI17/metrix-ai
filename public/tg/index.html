<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <title>Metrix AI Bot</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <img id="mark" alt="" width="28" height="28" />
        <div>
          <strong>Metrix AI Bot</strong>
          <span class="muted" id="top-sub">старт · без оплаты · маркетплейс</span>
        </div>
      </div>
      <button type="button" class="chip" id="btn-scheme">Схема</button>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-go="home" class="active">Главная</button>
      <button type="button" data-go="request">Запрос</button>
      <button type="button" data-go="flagships">Карточки</button>
      <button type="button" data-go="promo">Промо</button>
      <button type="button" data-go="terminal">Терминал</button>
    </nav>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
