<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#070a0f" />
  <title>Karim Metrix</title>
  <link rel="icon" href="/tg/assets/avatar.jpg" type="image/jpeg" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/tg/css/app.css" />
</head>
<body>
  <div id="app">
    <header class="nav">
      <a class="logo" href="#home" data-go="home">
        <span class="logo-mark">
          <img src="/tg/assets/mark.jpg" alt="Metrix AI" width="40" height="40" />
        </span>
        <span>
          <span class="logo-text">Karim <span>Metrix</span></span>
          <span class="logo-sub">комната</span>
        </span>
      </a>
      <a class="nav-x" href="https://x.com/karimmetrix" target="_blank" rel="noopener">@karimmetrix</a>
    </header>

    <main id="view"></main>

    <nav class="tabbar" aria-label="Разделы">
      <button type="button" data-go="landing" class="active">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg>
        Лендинг
      </button>
      <button type="button" data-go="engine">
        <svg viewBox="0 0 24 24"><path d="M4 15c2-6 14-6 16 0"/><circle cx="8" cy="10" r="1.4"/><circle cx="16" cy="10" r="1.4"/><path d="M8 16h8"/></svg>
        Движок
      </button>
      <button type="button" data-go="making">
        <svg viewBox="0 0 24 24"><rect x="5" y="4" width="14" height="16" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
        Мейкинг
      </button>
    </nav>
  </div>
  <script src="/tg/js/app.js"></script>
</body>
</html>
